<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>A shared meal · Tally</title>
<style>
  :root { --paper: #f6f2ea; --ink: #1d1b18; --muted: #6b655c; --rule: #d8d0c2; }
  @media (prefers-color-scheme: dark) { :root { --paper: #1b1a17; --ink: #ece6da; --muted: #a39b8d; --rule: #3a362f; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 Georgia, "Times New Roman", serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 30px; font-weight: normal; margin: 0 0 4px; overflow-wrap: anywhere; }
  .meta { font: 12px/1.4 ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 24px; }
  .totals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--rule); margin: 0 0 24px; }
  .totals div { padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .totals span { display: block; font: 11px/1.4 ui-monospace, Menlo, monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .totals b { font: 26px/1.3 ui-monospace, Menlo, monospace; font-weight: normal; }
  ul { list-style: none; padding: 0; margin: 0 0 24px; }
  li { padding: 10px 0; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 16px; }
  li small { display: block; font: 12px/1.4 ui-monospace, Menlo, monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  li em { font: 13px/1.6 ui-monospace, Menlo, monospace; font-style: normal; color: var(--muted); white-space: nowrap; }
  .note { font-style: italic; color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1 id="name">A shared meal</h1>
  <p class="meta" id="serves"></p>
  <div class="totals" id="totals"></div>
  <ul id="items"></ul>
  <p class="note" id="note">With Tally on an Android phone, this link opens the meal in Tally, ready to log.</p>
  <p class="note">The meal is written into this link itself, after the #. Browsers never send that part to a server, so no one but you and whoever shared it sees the meal. Its numbers are estimates.</p>
</main>
<script>
  // Mirrors SharedMeal.decode in the app: anything unexpected shows nothing. Only textContent is set.
  (function () {
    var LIMITS = { name: 60, itemName: 100, quantity: 80, brand: 60, items: 30, serves: 12, kcal: 20000, grams: 2000, encoded: 12000 };
    function clean(v, max) {
      if (typeof v !== "string" || /[\u0000-\u001f\u007f-\u009f]/.test(v)) return null;
      v = v.trim().replace(/\s+/g, " ");
      return v.length <= max ? v : null;
    }
    function num(v, max) { return typeof v === "number" && isFinite(v) && v >= 0 && v <= max ? v : null; }
    function decode(fragment) {
      if (!fragment || fragment.length > LIMITS.encoded || !/^[A-Za-z0-9_-]+$/.test(fragment)) return null;
      var b64 = fragment.replace(/-/g, "+").replace(/_/g, "/");
      while (b64.length % 4) b64 += "=";
      var o;
      try { o = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }))); } catch (e) { return null; }
      if (!o || o.v !== 1 || !Array.isArray(o.i) || o.i.length < 1 || o.i.length > LIMITS.items) return null;
      var name = clean(o.n, LIMITS.name);
      if (!name || !Number.isInteger(o.s) || o.s < 1 || o.s > LIMITS.serves) return null;
      var items = [];
      for (var i = 0; i < o.i.length; i++) {
        var it = o.i[i];
        if (!it || typeof it !== "object") return null;
        var n = clean(it.n, LIMITS.itemName);
        var q = "q" in it ? clean(it.q, LIMITS.quantity) : "";
        var b = "b" in it ? clean(it.b, LIMITS.brand) : "";
        var k = num(it.k, LIMITS.kcal), p = num(it.p, LIMITS.grams), c = num(it.c, LIMITS.grams), f = num(it.f, LIMITS.grams);
        if (!n || q === null || b === null || k === null || p === null || c === null || f === null) return null;
        items.push({ name: b && n.toLowerCase().indexOf(b.toLowerCase()) < 0 ? b + " " + n : n, quantity: q, kcal: k, p: p, c: c, f: f });
      }
      return { name: name, serves: o.s, items: items };
    }
    function el(tag, text) { var e = document.createElement(tag); if (text != null) e.textContent = text; return e; }
    var fmt = new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 });
    var meal = decode(location.hash.slice(1));
    if (!meal) {
      document.getElementById("name").textContent = "This link doesn't hold a meal";
      document.getElementById("note").textContent = "It may have been cut short when it was copied. Ask for it again.";
      return;
    }
    document.title = meal.name + " · Tally";
    document.getElementById("name").textContent = meal.name;
    document.getElementById("serves").textContent = meal.serves > 1 ? "Serves " + meal.serves + " · per serving" : "Whole meal";
    var t = meal.items.reduce(function (a, it) { return { k: a.k + it.kcal, p: a.p + it.p, c: a.c + it.c, f: a.f + it.f }; }, { k: 0, p: 0, c: 0, f: 0 });
    var totals = document.getElementById("totals");
    [["Kcal", t.k, ""], ["Protein", t.p, " g"], ["Carbs", t.c, " g"], ["Fat", t.f, " g"]].forEach(function (m) {
      var d = el("div"); d.appendChild(el("span", m[0])); d.appendChild(el("b", fmt.format(m[1] / meal.serves) + m[2])); totals.appendChild(d);
    });
    var list = document.getElementById("items");
    meal.items.forEach(function (it) {
      var li = el("li"), left = el("div", it.name);
      if (it.quantity) left.appendChild(el("small", it.quantity));
      li.appendChild(left); li.appendChild(el("em", fmt.format(it.kcal) + " kcal")); list.appendChild(li);
    });
    if (meal.serves > 1) list.appendChild(el("li", "")).replaceChildren(el("small", "Items are for the whole recipe"));
  })();
</script>
</body>
</html>
